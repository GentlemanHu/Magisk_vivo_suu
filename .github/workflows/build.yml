name: Magisk Build

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'native/**'
      - 'stub/**'
      - 'buildSrc/**'
      - 'build.py'
      - 'gradle.properties'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up GitHub env
        run: |
          ndk_ver=$(sed -n 's/^magisk.fullNdkVersion=//p' gradle.properties)
          echo ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT >> $GITHUB_ENV
          echo APP_ALLOW_MISSING_DEPS=true >> $GITHUB_ENV
          echo MAGISK_NDK_VERSION=$ndk_ver >> $GITHUB_ENV
        shell: bash

      - name: Initialize missing submodules
        run: |
          set -e
          git clone --depth=1 https://github.com/nanopb/nanopb.git native/jni/external/nanopb
          git clone --depth=1 https://github.com/topjohnwu/selinux.git native/jni/external/selinux
          git clone --depth=1 https://github.com/topjohnwu/mincrypt.git native/jni/external/mincrypt
          git clone --depth=1 https://github.com/lz4/lz4.git native/jni/external/lz4
          git clone --depth=1 https://github.com/nemequ/bzip2.git native/jni/external/bzip2
          git clone --depth=1 https://github.com/xz-mirror/xz.git native/jni/external/xz
          git clone --depth=1 https://github.com/dgibson/dtc.git native/jni/external/dtc
          git clone --depth=1 https://android.googlesource.com/platform/external/zlib native/jni/external/zlib
          # Pin ndk-busybox to Magisk v23.0 commit: latest HEAD dropped #include <sys/syslog.h>
          # which provides CODE/prioritynames/facilitynames needed by NDK r21e syslog.h
          git init native/jni/external/busybox
          git -C native/jni/external/busybox remote add origin https://github.com/topjohnwu/ndk-busybox.git
          git -C native/jni/external/busybox fetch --depth=1 origin 84ce191c8e3e69869617991c275f1b724422c604
          git -C native/jni/external/busybox checkout FETCH_HEAD
          git clone --depth=1 https://github.com/termux/termux-elf-cleaner.git tools/termux-elf-cleaner
          # Clone AOSP external/pcre at the exact commit used by Magisk v23.0 (has dist2/src/ structure)
          git init native/jni/external/pcre
          git -C native/jni/external/pcre remote add origin https://android.googlesource.com/platform/external/pcre
          git -C native/jni/external/pcre fetch --depth=1 origin 986dc24ace8aea66189a95510813747155fa3800
          git -C native/jni/external/pcre checkout FETCH_HEAD
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/magisk
          key: ${{ runner.os }}-ndk-${{ env.MAGISK_NDK_VERSION }}

      - name: Set up NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
             chmod -R 0777 *
             python build.py ndk

      - name: Build release
        run: python build.py -vr all

      - name: Refresh flag
        run: touch gradle.properties
        shell: bash

      - name: Build debug
        run: python build.py -v all

      - name: Stop gradle daemon
        run: ./gradlew --stop

      # Only upload artifacts built on Linux
      - name: Upload build artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: out
